server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (no CORS needed — same origin from browser POV)
    location /api/ {
        proxy_pass         http://bookfinder-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health endpoint forwarded to API for docker-compose depends_on
    location /health/ {
        proxy_pass http://bookfinder-api:8080/health/;
        proxy_http_version 1.1;
    }

    # Blazor WASM — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static framework assets aggressively
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/wasm application/json;
    gzip_min_length 256;
}
