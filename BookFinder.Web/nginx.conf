server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM SPA fallback — all unmatched routes return index.html
    # so client-side routing works correctly.
    # On Railway the browser calls the API directly via ApiBaseUrl
    # (set as a Railway environment variable injected at build time or via _env).
    # No proxy_pass needed here — that is only required for Docker Compose networking
    # where the browser cannot reach the API container directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Blazor framework assets aggressively — they are content-hashed
    # so it is safe to cache them for a long time.
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/wasm application/json;
    gzip_min_length 256;
}
