services:
  bookfinder-api:
    build:
      context: .
      dockerfile: BookFinder.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AI__GeminiApiKey: ${GEMINI_API_KEY}
      AI__GeminiModel: ${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bookfinder-web:
    build:
      context: .
      dockerfile: BookFinder.Web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      bookfinder-api:
        condition: service_healthy
